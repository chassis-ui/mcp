blank_issues_enabled: true
contact_links:
  - name: Documentation
    url: https://chassis-ui.com
    about: The Chassis UI design system, its tokens, CSS and components.
  - name: Chassis CSS (classes and components)
    url: https://github.com/chassis-ui/css
    about: Report a wrong style or a plugin bug against the CSS framework the skills write markup for.
  - name: Chassis Tokens (colors, spacing, typography values)
    url: https://github.com/chassis-ui/tokens
    about: Report a wrong token value or request a new token against the token package.
  - name: Security vulnerability
    url: https://github.com/chassis-ui/mcp/security/advisories/new
    about: Report it privately, not as a public issue.

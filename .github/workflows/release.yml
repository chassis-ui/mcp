name: Release

# On a push to main, creates the tag v<version> and the GitHub release of the version in
# package.json, with its CHANGELOG entry as the body, when the tag does not exist yet. The
# version and the CHANGELOG are made on develop with Changesets. See "Releases" in
# .github/CONTRIBUTING.md.
#
# The push itself is the deploy: Vercel builds main and serves it at mcp.chassis-ui.com
# through its Git integration, and the plugin marketplace installs from main. Neither waits
# for this workflow. What keeps a commit that failed CI away from main is the ruleset of
# main, which requires the checks below.
#
# The checks of ci.yml ran on this commit when it was pushed to develop. This workflow does
# not run them again. It reads their results and stops unless each one passed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a run that may be creating a release
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Version
    # A manual run on another branch stops here
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A version with a prerelease part, such as 0.2.0-next.0, is marked as a prerelease
      - name: Read the version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")

          {
            echo "version=$VERSION"
            echo "prerelease=$([ "${VERSION#*-}" = "$VERSION" ] && echo false || echo true)"
          } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION"

      # A push to main that does not change the version releases nothing
      - name: Check whether the tag exists
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "The tag v$VERSION exists. Nothing to release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "There is no tag v$VERSION. It will be released."
          fi

  checks:
    name: Checks Passed
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    steps:
      # The names of the jobs of ci.yml, which the ruleset of main requires too. Rename a job
      # in all three places.
      - name: Read the results of CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED: |
            Check (Node 22)
            Check (Node 24)
            Verify
        run: |
          RESULTS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.conclusion == "success") | .name')
          MISSING=0

          while IFS= read -r NAME; do
            [ -z "$NAME" ] && continue

            if printf '%s\n' "$RESULTS" | grep -qxF "$NAME"; then
              echo "passed: $NAME"
            else
              echo "::error::The check '$NAME' has not passed on $GITHUB_SHA"
              MISSING=1
            fi
          done <<< "$REQUIRED"

          exit $MISSING

  release:
    name: Release
    needs: [detect, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # to create the GitHub release and its tag
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # Nothing is installed: build/release-notes.js uses Node.js only
          package-manager-cache: false

      # Fails for a version without a CHANGELOG entry, so it gets no release
      - name: Release notes
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: node build/release-notes.js "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            FLAGS=(--prerelease --latest=false)
          else
            FLAGS=(--latest)
          fi

          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Chassis MCP v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${FLAGS[@]}"

name: CI

on:
  push:
    # A commit reaches `main` only after these checks passed on it, so they run on `develop`
    # first. Their results belong to the commit, and the ruleset of `main` and the release
    # workflow read them there, so pushing the same commit to `main` does not run them again.
    # A push to `main` is a production deploy of mcp.chassis-ui.com. See "Releases" in
    # .github/CONTRIBUTING.md.
    branches: [develop]
  pull_request:
    # Contributors open pull requests against `develop`
    branches: [develop, main]
  # Runs the checks again on a commit, on the branch the run is started from
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the running one. A push to `develop` always
# runs to the end: the ruleset and the release workflow read the results of that commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The ruleset of `main` requires Check (Node 22), Check (Node 24) and Verify by these names,
  # and release.yml reads them too. Rename a job in all three places.
  #
  # The lint, format and type checks and the tests on every Node.js version the server supports
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # The prepare script writes server/content.generated.ts, which the type check needs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # The whole repository, the skills among them; .prettierignore lists what is left out
      - name: Prettier
        run: pnpm lint:prettier

      - name: Type check
        run: pnpm typecheck

      # The contract of the server in memory, and the handler over HTTP
      - name: Test
        run: pnpm test

      # The generators, each on files of its own
      - name: Test the build scripts
        run: pnpm build:test

  # skills/chassis-implement-design/references/css-classes.md is committed and generated
  # from the installed @chassis-ui/css. This job generates it again and fails when the
  # result differs from the commit: the catalog was edited by hand, or @chassis-ui/css was
  # bumped without `pnpm generate`. server/content.generated.ts is generated in the same
  # run and is not committed, so it cannot differ.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm generate`, then a comparison of the catalog with the commit
      - name: Generate and compare with the commit
        run: pnpm verify

  # A change to what users get needs a changeset: the server, the handler, the skills, the
  # prompts, the generators and the plugin files (changedFilePatterns in
  # .changeset/config.json); `pnpm changeset --empty` adds one that releases nothing. A pull
  # request is compared with its base branch, a push to develop with the tip it replaced. The
  # version commit consumes the changesets, so a push that changes the version is skipped.
  changeset:
    name: Changeset
    # A manual run has nothing to compare with
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Changesets compares with an earlier commit
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for a changeset
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            SINCE="origin/$BASE_REF"
          else
            if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "No earlier commit to compare with"
              exit 0
            fi

            OLD_VERSION=$(git show "$BEFORE:package.json" | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')
            NEW_VERSION=$(node -p 'require("./package.json").version')
            if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
              echo "The push changes the version ($OLD_VERSION → $NEW_VERSION): a version step, which consumes changesets"
              exit 0
            fi

            SINCE="$BEFORE"
          fi

          pnpm changeset status --since "$SINCE"

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # The audit installs nothing: the automatic cache of setup-node finds no pnpm
          # store to save, and its post step fails the job
          package-manager-cache: false

      # Blocking: the runtime dependencies, the MCP SDK and zod with what they install, are
      # what the deployed function runs
      - name: Audit runtime dependencies
        run: pnpm check:pnpm

      # Reports only: the lint and build tooling is never deployed
      - name: Audit all dependencies
        run: pnpm audit
        continue-on-error: true

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

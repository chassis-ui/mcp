version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Dependabot waits 3 days after a release by default, and passes that on to pnpm as its
    # minimum release age when it re-resolves the lockfile, so a Chassis package that develop
    # already requires would fail the whole run until it is 3 days old. Chassis releases can be
    # urgent fixes between our own packages: they are exempt here, and from pnpm's check in
    # pnpm-workspace.yaml. Everything else keeps the default.
    cooldown:
      default-days: 3
      exclude:
        - '@chassis-ui/*'
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # The server is type-checked against Node.js 22, the oldest version it supports
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # Minor and patch updates of the tooling in one pull request. @chassis-ui/css is left
      # out: the class catalog of the chassis-implement-design skill is generated from it, so
      # its pull request also needs `pnpm generate`, and the Verify job fails until it has it.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns:
          - '@chassis-ui/*'

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
